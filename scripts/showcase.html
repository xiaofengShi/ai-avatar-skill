<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="assets/logo.png">
<title>Editorial Avatar · 肖像案例展厅</title>
<meta name="description" content="Editorial Avatar 的肖像设计案例、原图与结果对照、小尺寸裁切预览。适用于 Codex 和 ChatGPT。">
<style>
:root{--paper:#f7f5f0;--ink:#292a26;--muted:#62645c;--line:#d8d7ce;--accent:#8b4638;--white:#fff;--panel:#efeee8}
*{box-sizing:border-box}html{scroll-padding-top:24px}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 system-ui,-apple-system,sans-serif}a{color:var(--accent);text-underline-offset:4px}a:hover{text-decoration-thickness:2px}a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}img{max-width:100%;height:auto}p{margin:16px 0}strong{font-weight:650}.skip{position:absolute;left:16px;top:-100px;background:var(--white);padding:12px;z-index:2}.skip:focus{top:12px}
.site-header,main,footer{max-width:1280px;margin:auto;padding-inline:clamp(20px,5vw,64px)}.site-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:22px;border-bottom:1px solid var(--line)}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:18px;font-weight:750;letter-spacing:-.5px}.brand-logo{width:36px;height:36px;flex:none;border-radius:7px}.brand span{color:var(--accent)}nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px 24px}nav a{display:inline-flex;align-items:center;gap:7px;min-height:44px;text-decoration:none;font-size:14px;font-weight:600}.icon{width:18px;height:18px;vertical-align:middle}.repo{border:1px solid var(--line);border-radius:6px;padding:0 14px;background:var(--white)}
.hero{padding:56px 0 36px;border-bottom:1px solid var(--line)}.hero .eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;color:var(--accent);font-weight:700;margin:0 0 20px}.hero h1{font-family:Georgia,'Songti SC',serif;font-size:clamp(32px,4vw,54px);font-weight:500;letter-spacing:-1px;line-height:1.3;max-width:840px;margin:0 0 22px}.hero .intro{color:var(--muted);max-width:740px;font-size:17px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.actions a{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;min-height:44px;border:1px solid var(--accent);border-radius:5px;text-decoration:none;font-size:14px;font-weight:650}.actions .primary{background:var(--accent);color:white}
h2{font-size:26px;line-height:1.4;letter-spacing:-.5px;margin:44px 0 16px}main>p{max-width:1000px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px;margin:28px 0 40px}.case{min-width:0;border-top:2px solid var(--ink);padding-top:16px}.case header{display:flex;gap:14px;align-items:baseline;min-height:108px}.case-number{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}.case h3{font-size:19px;line-height:1.6;margin:0}.case h3 br{display:none}.case h3 strong{display:block}.brief{font-size:14px;color:var(--muted);line-height:1.6}.brief br{display:block!important}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair figure{margin:0;min-width:0}.pair figure>a{display:block;background:var(--panel);overflow:hidden;border-radius:4px}.pair img{display:block;width:100%;aspect-ratio:1;object-fit:contain;margin:0}.case:first-child .pair img{aspect-ratio:3/4}.pair figcaption{font-size:12px;color:var(--muted);margin-top:7px;letter-spacing:.5px}.observation{font-size:14px;line-height:1.8;margin-top:14px}.observation>a{display:inline-block;min-height:32px;padding-block:3px}.observation strong{color:var(--accent)}
#preview{border-top:1px solid var(--line);padding-top:34px}.preview-shot{display:block;max-width:720px;margin:24px 0}.preview-shot img{display:block;width:100%;border:1px solid var(--line);border-radius:8px}#start{border-top:1px solid var(--line);padding-top:34px}footer{margin-top:56px;padding-block:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:13px}footer a{color:inherit}details{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:14px}summary{cursor:pointer;font-weight:650;color:var(--ink);min-height:44px;padding-top:8px}details p{max-width:980px}
@media(max-width:760px){.gallery{grid-template-columns:1fr;gap:32px}.site-header{align-items:flex-start;flex-direction:column;gap:6px;padding-block:14px}nav{gap:4px 18px}.hero{padding:30px 0}.case header{min-height:0;padding-bottom:16px}footer{flex-direction:column}.pair{gap:8px}h2{font-size:24px}.hero .intro{font-size:16px}}
@media print{body{background:white}.site-header nav,.actions,.skip{display:none}.hero{padding:12px 0}.gallery{display:block}.case{break-inside:avoid;margin-bottom:24px}.pair{max-width:560px}details{display:block}details::details-content{content-visibility:visible}a{color:inherit}footer{margin-top:20px}}
</style>
</head>
<body>
<a class="skip" href="#main">跳到案例内容</a>
<header class="site-header"><a class="brand" href="./"><img class="brand-logo" src="assets/logo.png" width="36" height="36" alt=""><span style="color:inherit">Editorial <span>Avatar</span></span></a><nav aria-label="主导航"><a href="#examples">案例对照</a><a href="#preview">裁切预览</a><a href="https://github.com/xiaofengShi/editorial-avatar#readme">使用文档 ↗</a><a class="repo" href="https://github.com/xiaofengShi/editorial-avatar"><img class="icon" src="assets/icons/code.svg" alt="">GitHub ↗</a></nav></header>
<main id="main">{{content}}</main>
<footer><span>Editorial Avatar · 肖像设计工作流</span><span><a href="https://github.com/xiaofengShi/editorial-avatar">GitHub</a> · <a href="validation.html">验证记录</a> · <a href="https://github.com/xiaofengShi/editorial-avatar/blob/main/ASSETS.md">素材与授权</a></span></footer>
</body></html>
